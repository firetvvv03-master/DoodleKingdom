<!DOCTYPE html>

<head>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Fredoka & Quicksand -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            quicksand: ['Quicksand', 'sans-serif'],
          },
          colors: {
            magicYellow: '#FFD166',
            magicPink: '#FF6B6B',
            magicPurple: '#A06CD5',
            magicBlue: '#4ECDC4',
            magicGreen: '#06D6A0',
          },
          animation: {
            'bounce-gentle': 'bounceGentle 2s infinite',
            'float': 'float 3s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 1.5s infinite alternate',
          },
          keyframes: {
            bounceGentle: {
              '0%, 100%': { transform: 'translateY(-3px)' },
              '50%': { transform: 'translateY(3px)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-5px) rotate(1deg)' }
            },
            pulseGlow: {
              '0%': { boxShadow: '0 0 10px rgba(255,107,107,0.5)' },
              '100%': { boxShadow: '0 0 22px rgba(255,209,102,0.9), 0 0 14px rgba(78,205,196,0.8)' }
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Fredoka', sans-serif;
      overflow: hidden;
      background: #0f172a;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #A06CD5;
      border-radius: 10px;
    }
    .candy-btn {
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .candy-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }
    .sparkle-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 50;
    }
    .skin-card {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .skin-card:hover {
      transform: translateY(-3px) scale(1.02);
    }
    .anim-chip {
      transition: all 0.15s ease;
    }
    .anim-chip.active {
      background-color: #A06CD5;
      color: #ffffff;
      border-color: #7B2CBF;
      box-shadow: 0 2px 6px rgba(160, 108, 213, 0.4);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-slate-900 text-slate-800">

  <!-- ==================== JAVASCRIPT ENGINE ==================== -->
  <script>
    /* --------------------------------------------------
     * 1. AUDIO SYNTHESIZER (EXPANDED SOUND FX FOR CATEGORIES & ACTIONS)
     * -------------------------------------------------- */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;

        if (type === 'tap') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.05);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'bounce') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(480, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'magic') {
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.04);
            gain.gain.setValueAtTime(0.12, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.04);
            osc.stop(now + i * 0.04 + 0.15);
          });
        } else if (type === 'pop') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.05);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'speech') {
          // Cute blip sound when speaking
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.linearRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'save') {
          // Save chime
          [440, 554.37, 659.25].forEach((f, i) => {

          svgContent = `<path d="M 30 135 L 45 50 L 75 95 L 100 30 L 125 95 L 155 50 L 170 135 Z" fill="hsl(${colorHue}, 90%, 55%)" stroke="#000" stroke-width="5"/><rect x="30" y="130" width="140" height="22" rx="4" fill="#E71D36" stroke="#000" stroke-width="3"/><circle cx="100" cy="70" r="8" fill="#4CC9F0"/>`;
        } else if (variant === 1) {
          svgContent = `<rect x="92" y="65" width="16" height="115" rx="8" fill="#795548" stroke="#000" stroke-width="4"/><circle cx="100" cy="45" r="24" fill="hsl(${colorHue}, 75%, 60%)" stroke="#000" stroke-width="5"/><circle cx="100" cy="45" r="10" fill="#FFF"/>`;
        } else if (variant === 2) {
          svgContent = `<path d="M 40 45 L 160 45 L 160 100 Q 160 165 100 185 Q 40 165 40 100 Z" fill="hsl(${colorHue}, 80%, 45%)" stroke="#000" stroke-width="5"/><path d="M 100 45 L 100 185" stroke="#FFD166" stroke-width="6"/><circle cx="100" cy="105" r="22" fill="#FFD166" stroke="#000" stroke-width="3"/>`;
        } else if (variant === 3) {
          svgContent = `<path d="M 100 100 Q 30 20 10 90 Q 50 140 100 110 Z" fill="hsl(${colorHue}, 70%, 90%)" stroke="#000" stroke-width="4"/><path d="M 100 100 Q 170 20 190 90 Q 150 140 100 110 Z" fill="hsl(${colorHue}, 70%, 90%)" stroke="#000" stroke-width="4"/>`;
        } else if (variant === 4) {
          svgContent = `<rect x="40" y="60" width="45" height="90" rx="15" fill="hsl(${colorHue}, 20%, 70%)" stroke="#000" stroke-width="4"/><rect x="115" y="60" width="45" height="90" rx="15" fill="hsl(${colorHue}, 20%, 70%)" stroke="#000" stroke-width="4"/><path d="M 50 150 L 62 180 L 75 150 Z" fill="#FF5722"/><path d="M 125 150 L 137 180 L 150 150 Z" fill="#FF5722"/>`;
        } else if (variant === 5) {
          svgContent = `<path d="M 60 160 Q 140 140 165 40 Q 130 70 50 140 Z" fill="hsl(${colorHue}, 25%, 80%)" stroke="#000" stroke-width="4"/><circle cx="50" cy="150" r="16" fill="#FFD166" stroke="#000" stroke-width="3"/>`;
        } else if (variant === 6) {
          svgContent = `<circle cx="65" cy="100" r="30" fill="#795548" stroke="#000" stroke-width="5"/><circle cx="135" cy="100" r="30" fill="#795548" stroke="#000" stroke-width="5"/><circle cx="65" cy="100" r="20" fill="hsl(${colorHue}, 90%, 60%)" stroke="#000" stroke-width="3"/><circle cx="135" cy="100" r="20" fill="hsl(${colorHue}, 90%, 60%)" stroke="#000" stroke-width="3"/><line x1="95" y1="100" x2="105" y2="100" stroke="#000" stroke-width="6"/>`;
        } else {
          svgContent = `<rect x="35" y="85" width="130" height="70" fill="hsl(${colorHue}, 40%, 45%)" stroke="#000" stroke-width="5"/><path d="M 35 85 Q 100 45 165 85 Z" fill="#6D4C41" stroke="#000" stroke-width="5"/><rect x="90" y="90" width="20" height="25" fill="#FFD166" stroke="#000" stroke-width="3"/>`;
        }
      } else if (cat === 'backgrounds') {
        const bgType = i % 40;
        const colorHue = (i * 9) % 360;

        if (bgType === 0) {
          svgContent = `<rect width="200" height="200" fill="#0B091A"/><circle cx="40" cy="40" r="2" fill="#FFF"/><circle cx="160" cy="30" r="3" fill="#FFD166"/><circle cx="120" cy="120" r="1.5" fill="#FFF"/><circle cx="150" cy="150" r="22" fill="#7209B7" opacity="0.6"/><ellipse cx="150" cy="150" rx="35" ry="8" fill="none" stroke="#4CC9F0" stroke-width="3" transform="rotate(-20 150 150)"/>`;
        } else if (bgType === 1) {
          svgContent = `<rect width="200" height="200" fill="#0077B6"/><path d="M 0 160 Q 50 130 100 160 T 200 160 L 200 200 L 0 200 Z" fill="#0096C7"/><path d="M 30 200 Q 20 140 40 110" fill="none" stroke="#06D6A0" stroke-width="10" stroke-linecap="round"/><path d="M 160 200 Q 180 130 150 100" fill="none" stroke="#FF70A6" stroke-width="12" stroke-linecap="round"/><circle cx="80" cy="60" r="6" fill="none" stroke="#FFF" opacity="0.6"/><circle cx="85" cy="40" r="4" fill="none" stroke="#FFF" opacity="0.6"/>`;
        } else if (bgType === 2) {
          svgContent = `<rect width="200" height="200" fill="#132A13"/><path d="M 0 120 Q 100 90 200 120 L 200 200 L 0 200 Z" fill="#31572C"/><circle cx="40" cy="100" r="45" fill="#4F772D"/><circle cx="160" cy="90" r="55" fill="#4F772D"/><circle cx="90" cy="140" r="4" fill="#FFD166" opacity="0.9"/><circle cx="130" cy="120" r="3" fill="#FFD166" opacity="0.9"/>`;
        } else if (bgType === 3) {
          svgContent = `<rect width="200" height="200" fill="#386641"/><path d="M -20 50 Q 40 10 80 80" fill="none" stroke="#6A994E" stroke-width="20"/><path d="M 120 30 Q 160 100 220 40" fill="none" stroke="#6A994E" stroke-width="24"/><path d="M 0 150 Q 100 130 200 150 L 200 200 L 0 200 Z" fill="#152814"/>`;
        } else if (bgType === 4) {
          svgContent = `<rect width="200" height="200" fill="#0D0221"/><rect x="20" y="60" width="40" height="140" fill="#0F084B"/><rect x="75" y="30" width="50" height="170" fill="#26408B"/><rect x="140" y="80" width="45" height="120" fill="#0F084B"/><line x1="0" y1="160" x2="200" y2="160" stroke="#FF007F" stroke-width="4"/><line x1="20" y1="80" x2="60" y2="80" stroke="#00F5D4" stroke-width="3"/>`;
        } else {
          // Dynamic vivid color backgrounds for 5 through 39
          svgContent = `<rect width="200" height="200" fill="hsl(${colorHue}, 60%, 25%)"/><circle cx="100" cy="70" r="45" fill="hsl(${(colorHue+40)%360}, 75%, 65%)" opacity="0.8"/><path d="M 0 140 Q 100 110 200 140 L 200 200 L 0 200 Z" fill="hsl(${(colorHue+120)%360}, 70%, 40%)"/><line x1="0" y1="140" x2="200" y2="140" stroke="#FFF" stroke-width="3" opacity="0.5"/>`;
        }
      }

      const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">${svgContent}</svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svgString);
    }

    // Render skins UI grid
    function renderSkinsGrid(filterText = '') {
      const container = document.getElementById('skins-grid');
      container.innerHTML = '';

      let matchCount = 0;
      const count = ITEM_NAMES[activeCategory].length;

      for (let i = 0; i <= count; i++) {
        const skinName = i === 0 ? (activeCategory === 'backgrounds' ? 'Blank Custom World' : 'Blank Canvas') : ITEM_NAMES[activeCategory][i - 1];
        
        if (filterText && !skinName.toLowerCase().includes(filterText.toLowerCase()) && !String(i).includes(filterText)) {
          continue;
        }

        matchCount++;
        const card = document.createElement('div');
        const isSelected = currentSkinIndex === i;

        card.className = `skin-card cursor-pointer rounded-xl p-1.5 flex flex-col items-center justify-between border-2 ${isSelected ? 'bg-purple-100 border-purple-600 ring-2 ring-purple-400' : 'bg-white border-slate-200 hover:border-purple-300'} shadow-sm`;
        
        if (i === 0) {
          card.innerHTML = `
            <div class="w-full h-14 rounded-lg bg-slate-50 border-2 border-dashed border-purple-400 flex items-center justify-center text-xl text-purple-600">
              ${activeCategory === 'backgrounds' ? '🏞️' : '✏️'}
            </div>
            <span class="text-[10px] font-extrabold text-slate-800 mt-1 text-center leading-tight">${skinName}</span>
          `;
        } else {
          const svgUrl = generateSkinSVG(activeCategory, i);
          card.innerHTML = `
            <div class="w-full h-14 rounded-lg bg-slate-50 p-1 flex items-center justify-center overflow-hidden">
              <img src="${svgUrl}" class="max-h-full max-w-full object-contain pointer-events-none" alt="${skinName}">
            </div>
            <span class="text-[9px] font-extrabold text-slate-700 mt-1 text-center truncate w-full">${skinName}</span>
          `;
        }

        card.onclick = () => selectSkin(i);
        container.appendChild(card);
      }

      document.getElementById('skin-count-indicator').innerText = `${matchCount} Skins`;
    }

    function filterSkins() {
      const text = document.getElementById('skin-search').value;
      renderSkinsGrid(text);
    }

    function selectSkin(index) {
      playSound(activeCategory);
      currentSkinIndex = index;
      renderSkinsGrid(document.getElementById('skin-search').value);

      const activeLabel = document.getElementById('active-skin-title');

      if (index === 0) {
        if (activeCategory === 'backgrounds') {
          activeLabel.innerText = '🏞️ Blank Custom World - Draw Your Own Sky/Land!';
          currentWorldBackground = -1; // Flag for drawing custom background
        } else {
          activeLabel.innerText = '🎨 Blank Canvas (Clean Start)';
          clearCanvas();
        }
      } else {
        const name = ITEM_NAMES[activeCategory][index - 1] || `Item #${index}`;
        if (activeCategory === 'backgrounds') {
          activeLabel.innerText = `🏞️ World: ${name} Selected!`;
          currentWorldBackground = index;
          customBackgroundDataUrl = null;
        } else {
          activeLabel.innerText = `✨ ${name} Loaded - Draw & Customize!`;
          loadSkinToCanvas(activeCategory, index);
        }
      }
    }

    function loadSkinToCanvas(cat, index) {
      const svgUrl = generateSkinSVG(cat, index);
      const img = new Image();
      img.onload = () => {
        studioCtx.clearRect(0, 0, studioCanvas.width, studioCanvas.height);
        const padding = 30;
        const size = studioCanvas.width - (padding * 2);
        studioCtx.drawImage(img, padding, padding, size, size);
      };
      img.src = svgUrl;
    }

    /* --------------------------------------------------
     * 3. STUDIO CANVAS DRAWING LOGIC
     * -------------------------------------------------- */
    const studioCanvas = document.getElementById('studio-canvas');
    const studioCtx = studioCanvas.getContext('2d');
    let isDrawing = false;
    let currentTool = 'pen';
    let brushColor = '#FF6B6B';
    let isRainbow = false;
    let rainbowHue = 0;
    let brushSize = 10;

    const paletteColors = [
      '#FF6B6B', '#FFD166', '#06D6A0', '#4ECDC4', '#118AB2', 
      '#A06CD5', '#FF9F1C', '#333333', '#FFFFFF'
    ];

    function initStudio() {
      const palContainer = document.getElementById('color-palette');
      palContainer.innerHTML = '';
      paletteColors.forEach((col, idx) => {
        const btn = document.createElement('button');
        btn.className = `w-5 h-5 md:w-6 md:h-6 rounded-lg border-2 ${idx === 0 ? 'border-black scale-110' : 'border-white'} transition-all candy-btn shrink-0`;
        btn.style.backgroundColor = col;
        btn.onclick = () => selectColor(col, btn);
        palContainer.appendChild(btn);
      });

      studioCanvas.addEventListener('mousedown', startDrawing);
      studioCanvas.addEventListener('mousemove', draw);
      studioCanvas.addEventListener('mouseup', stopDrawing);
      studioCanvas.addEventListener('mouseleave', stopDrawing);

      studioCanvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent('mousedown', { clientX: touch.clientX, clientY: touch.clientY });
        studioCanvas.dispatchEvent(mouseEvent);
      });
      studioCanvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent('mousemove', { clientX: touch.clientX, clientY: touch.clientY });
        studioCanvas.dispatchEvent(mouseEvent);
      });
      studioCanvas.addEventListener('touchend', () => {
        const mouseEvent = new MouseEvent('mouseup', {});
        studioCanvas.dispatchEvent(mouseEvent);
      });

      renderSkinsGrid();
      buildAnimationUI();
    }

    function resizeStudioCanvas() {
      const container = document.getElementById('studio-canvas-container');
      if (!container) return;

      const size = Math.min(container.clientWidth - 20, container.clientHeight - 20, 520);
      
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = studioCanvas.width;
      tempCanvas.height = studioCanvas.height;
      if (tempCanvas.width > 0) {
        tempCanvas.getContext('2d').drawImage(studioCanvas, 0, 0);
      }

      studioCanvas.width = size;
      studioCanvas.height = size;

      if (tempCanvas.width > 0) {
        studioCtx.drawImage(tempCanvas, 0, 0, size, size);
      } else {
        clearCanvas();
      }
    }

    function selectColor(color, element) {
      playSound('tap');
      brushColor = color;
      isRainbow = false;
      document.getElementById('rainbow-brush-btn').classList.remove('ring-2', 'ring-yellow-300');
      
      const btns = document.querySelectorAll('#color-palette button');
      btns.forEach(b => b.classList.remove('border-black', 'scale-110'));
      if (element) element.classList.add('border-black', 'scale-110');
      
      if (currentTool === 'eraser') setTool('pen');
    }

    function toggleRainbowBrush() {
      playSound('magic');
      isRainbow = !isRainbow;
      const btn = document.getElementById('rainbow-brush-btn');
      if (isRainbow) {
        btn.classList.add('ring-2', 'ring-yellow-300');
        if (currentTool === 'eraser') setTool('pen');
      } else {
        btn.classList.remove('ring-2', 'ring-yellow-300');
      }
    }

    function updateBrushSize(val) {
      brushSize = val;
      document.getElementById('brush-size-val').innerText = val;
    }

    function setTool(tool) {
      playSound('tap');
      currentTool = tool;
      const penBtn = document.getElementById('tool-pen');
      const eraserBtn = document.getElementById('tool-eraser');

      if (tool === 'pen') {
        penBtn.className = 'px-2 py-1 rounded-lg bg-purple-600 text-white font-bold text-xs';
        eraserBtn.className = 'px-2 py-1 rounded-lg bg-slate-200 text-slate-700 font-bold text-xs';
      } else {
        eraserBtn.className = 'px-2 py-1 rounded-lg bg-purple-600 text-white font-bold text-xs';
        penBtn.className = 'px-2 py-1 rounded-lg bg-slate-200 text-slate-700 font-bold text-xs';
      }
    }

    function setCategory(cat) {
      playSound(cat);
      activeCategory = cat;
      currentSkinIndex = 0;

      CATEGORIES.forEach(c => {
        const btn = document.getElementById(`cat-${c}`);
        if (btn) {
          if (c === cat) {
            btn.className = 'cat-btn candy-btn bg-purple-600 text-white p-1.5 rounded-xl font-bold flex items-center justify-center gap-1 text-[10px] md:text-xs';
          } else {
            btn.className = 'cat-btn candy-btn bg-slate-100 text-slate-700 p-1.5 rounded-xl font-bold flex items-center justify-center gap-1 text-[10px] md:text-xs';
          }
        }
      });

      document.getElementById('skin-search').value = '';
      selectSkin(0);
    }

    function getCanvasPos(e) {
      const rect = studioCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (studioCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (studioCanvas.height / rect.height)
      };
    }

    function startDrawing(e) {
      initAudio();
      isDrawing = true;
      const pos = getCanvasPos(e);
      studioCtx.beginPath();
      studioCtx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCanvasPos(e);

      studioCtx.lineWidth = brushSize;
      studioCtx.lineCap = 'round';
      studioCtx.lineJoin = 'round';

      if (currentTool === 'eraser') {
        studioCtx.globalCompositeOperation = 'destination-out';
        studioCtx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        studioCtx.globalCompositeOperation = 'source-over';
        if (isRainbow) {
          rainbowHue = (rainbowHue + 4) % 360;
          studioCtx.strokeStyle = `hsl(${rainbowHue}, 90%, 60%)`;
        } else {
          studioCtx.strokeStyle = brushColor;
        }
      }

      studioCtx.lineTo(pos.x, pos.y);
      studioCtx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        studioCtx.closePath();
        isDrawing = false;
      }
    }

    function clearCanvas() {
      playSound('pop');
      studioCtx.clearRect(0, 0, studioCanvas.width, studioCanvas.height);
    }

    /* --------------------------------------------------
     * 4. KINGDOM ACTOR & SPEECH BUBBLE ENGINE
     * -------------------------------------------------- */
    const worldCanvas = document.getElementById('world-canvas');
    const worldCtx = worldCanvas.getContext('2d');
    let worldObjects = [];
    let selectedObject = null;
    let draggedObject = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let particles = [];

    class KingdomActor {
      constructor(imgData, category, x, y, speech = '') {
        this.id = Date.now() + Math.random();
        this.category = category;
        this.x = x;
        this.y = y;
        this.baseSize = 120;
        this.scale = 1.0;
        this.imgData = imgData;
        this.img = new Image();
        this.img.src = imgData;

        // Speech bubble state
        this.speechText = speech;
        this.speechTimer = speech ? 300 : 0; // Frames to display speech bubble

        // Default to standing completely still
        this.animation = 'idle';
        
        this.animTimer = Math.random() * 10;
        this.bounceY = 0;
        this.angle = 0;
        this.scaleX = 1;
        this.scaleY = 1;
        this.facingRight = true;
      }

      update(width, height) {
        this.animTimer += 0.08;

        if (this.speechTimer > 0) {
          this.speechTimer--;
        }

        let targetBounceY = 0;
        let targetAngle = 0;
        let targetScaleX = 1;
        let targetScaleY = 1;

        switch (this.animation) {
          case 'idle':
            targetBounceY = 0;
            targetAngle = 0;
            break;
          case 'walking':
            this.x += this.facingRight ? 1.2 : -1.2;
            if (this.x < 80) this.facingRight = true;
            if (this.x > width - 80) this.facingRight = false;
            targetBounceY = -Math.abs(Math.sin(this.animTimer * 4)) * 8;
            targetAngle = Math.sin(this.animTimer * 4) * 0.08;
            break;
          case 'running':
            this.x += this.facingRight ? 3.0 : -3.0;
            if (this.x < 80) this.facingRight = true;
            if (this.x > width - 80) this.facingRight = false;
            targetBounceY = -Math.abs(Math.sin(this.animTimer * 8)) * 16;
            targetAngle = Math.sin(this.animTimer * 8) * 0.18;
            break;
          case 'jumping':
            targetBounceY = -Math.abs(Math.sin(this.animTimer * 3.5)) * 32;
            targetScaleY = 1 + (targetBounceY / 120);
            targetScaleX = 1 - (targetBounceY / 200);
            break;
          case 'sitting':
            targetBounceY = 18;
            targetScaleY = 0.8;
            targetScaleX = 1.15;
            break;
          case 'dancing':
            targetAngle = Math.sin(this.animTimer * 6) * 0.35;
            targetBounceY = -Math.abs(Math.sin(this.animTimer * 5)) * 14;
            targetScaleX = 1 + Math.sin(this.animTimer * 6) * 0.12;
            break;
          case 'sleeping':
            targetAngle = -Math.PI / 2.2;
            targetBounceY = 30;
            targetScaleX = 1 + Math.sin(this.animTimer * 1.5) * 0.04;
            break;
          case 'climbing':
            targetBounceY = -Math.abs(Math.sin(this.animTimer * 3)) * 25;
            targetAngle = Math.sin(this.animTimer * 4) * 0.12;
            break;
          case 'driving':
            this.x += this.facingRight ? 4.5 : -4.5;
            if (this.x < 90) this.facingRight = true;
            if (this.x > width - 90) this.facingRight = false;
            targetBounceY = (Math.random() - 0.5) * 3;
            break;
        }

        this.bounceY += (targetBounceY - this.bounceY) * 0.2;
        this.angle += (targetAngle - this.angle) * 0.2;
        this.scaleX += (targetScaleX - this.scaleX) * 0.2;
        this.scaleY += (targetScaleY - this.scaleY) * 0.2;
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y + this.bounceY);
        ctx.rotate(this.angle);
        
        const dir = this.facingRight ? 1 : -1;
        ctx.scale(this.scale * this.scaleX * dir, this.scale * this.scaleY);

        const w = this.baseSize;
        const h = this.baseSize;

        if (this.animation !== 'sleeping') {
          ctx.beginPath();
          ctx.ellipse(0, h / 2 - 5, w / 2.8, 10, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0,0,0,0.12)';
          ctx.fill();
        }

        if (this.img.complete) {
          ctx.drawImage(this.img, -w / 2, -h / 2, w, h);
        }

        if (selectedObject === this) {
          ctx.strokeStyle = '#FFD166';
          ctx.lineWidth = 4;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.arc(0, 0, w / 1.4, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();

        // Render Speech Bubble above actor
        if (this.speechText && this.speechTimer > 0) {
          this.drawSpeechBubble(ctx);
        }
      }

      drawSpeechBubble(ctx) {
        ctx.save();
        const topY = this.y + this.bounceY - (this.baseSize * this.scale * 0.6) - 15;
        ctx.font = 'bold 14px Fredoka, sans-serif';
        const textWidth = ctx.measureText(this.speechText).width;
        const bubbleWidth = Math.max(70, textWidth + 24);
        const bubbleHeight = 32;

        const bx = this.x - bubbleWidth / 2;
        const by = topY - bubbleHeight;

        // Bubble Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.roundRect(bx + 2, by + 2, bubbleWidth, bubbleHeight, 14);
        ctx.fill();

        // Bubble background
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = '#A06CD5';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(bx, by, bubbleWidth, bubbleHeight, 14);
        ctx.fill();
        ctx.stroke();

        // Bubble pointer tail
        ctx.beginPath();
        ctx.moveTo(this.x - 6, by + bubbleHeight);
        ctx.lineTo(this.x, by + bubbleHeight + 8);
        ctx.lineTo(this.x + 6, by + bubbleHeight);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#A06CD5';
        ctx.stroke();

        // Bubble Text
        ctx.fillStyle = '#2D1B69';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.speechText, this.x, by + bubbleHeight / 2);
        ctx.restore();
      }

      containsPoint(px, py) {
        const rad = (this.baseSize / 2) * this.scale;
        const dx = px - this.x;
        const dy = py - (this.y + this.bounceY);
        return (dx * dx + dy * dy) <= (rad * rad);
      }

      clickSoftReaction() {
        playSound(this.category || 'bounce');
        
        // Random speech on click if none set
        if (!this.speechText || this.speechTimer <= 0) {
          const list = DEFAULT_SPEECH[this.category] || DEFAULT_SPEECH.people;
          this.speechText = list[Math.floor(Math.random() * list.length)];
          playSound('speech');
        }
        this.speechTimer = 240; // 4 seconds visible

        for (let i = 0; i < 6; i++) {
          particles.push(new Particle(this.x, this.y - 10));
        }
      }
    }

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = -Math.random() * 3 - 1;
        this.size = 12 + Math.random() * 8;
        this.life = 1.0;
        this.icon = ['⭐', '💖', '✨', '🎉', '🎈', '💬'][Math.floor(Math.random() * 6)];
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1;
        this.life -= 0.03;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = `${this.size}px Fredoka`;
        ctx.fillText(this.icon, this.x, this.y);
        ctx.restore();
      }
    }

    function initWorld() {
      resizeWorldCanvas();
      window.addEventListener('resize', resizeWorldCanvas);

      createStarterKingdom();

      worldCanvas.addEventListener('mousedown', onWorldMouseDown);
      worldCanvas.addEventListener('mousemove', onWorldMouseMove);
      worldCanvas.addEventListener('mouseup', onWorldMouseUp);

      worldCanvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        onWorldMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
      });
      worldCanvas.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        onWorldMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
      });
      worldCanvas.addEventListener('touchend', () => {
        onWorldMouseUp();
      });

      requestAnimationFrame(worldLoop);
    }

    function resizeWorldCanvas() {
      const container = document.getElementById('world-canvas-container');
      worldCanvas.width = container.clientWidth;
      worldCanvas.height = container.clientHeight;
    }

    function createStarterKingdom() {
      const w = window.innerWidth || 800;
      const h = window.innerHeight || 600;

      const starterCats = ['people', 'animal', 'tool', 'monster', 'vehicle', 'castle', 'tree', 'accessories'];
      starterCats.forEach((cat, idx) => {
        const svgUrl = generateSkinSVG(cat, (idx % 8) + 1);
        const posX = w * (0.15 + idx * 0.1);
        const posY = h * (0.48 + (idx % 2) * 0.12);
        const defaultPhrases = DEFAULT_SPEECH[cat] || ["Hello!"];
        const phrase = defaultPhrases[idx % defaultPhrases.length];
        worldObjects.push(new KingdomActor(svgUrl, cat, posX, posY, phrase));
      });
    }

    function buildAnimationUI() {
      const container = document.getElementById('anim-selector-container');
      container.innerHTML = '';

      ANIMATIONS.forEach(anim => {
        const chip = document.createElement('button');
        chip.id = `anim-chip-${anim.id}`;
        chip.className = 'anim-chip px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-purple-100 text-slate-700 font-bold text-xs border border-slate-200 whitespace-nowrap flex items-center gap-1';
        chip.innerHTML = `<span>${anim.label}</span>`;
        chip.onclick = () => setActorAnimation(anim.id);
        container.appendChild(chip);
      });
    }

    function setActorAnimation(animId) {
      if (selectedObject) {
        playSound('tap');
        selectedObject.animation = animId;
        updateAnimationChips();
      }
    }

    function updateAnimationChips() {
      if (!selectedObject) return;
      ANIMATIONS.forEach(anim => {
        const chip = document.getElementById(`anim-chip-${anim.id}`);
        if (chip) {
          if (selectedObject.animation === anim.id) {
            chip.classList.add('active');
          } else {
            chip.classList.remove('active');
          }
        }
      });
    }

    function setSpeechFromInput() {
      const input = document.getElementById('speech-input');
      if (selectedObject && input) {
        playSound('speech');
        selectedObject.speechText = input.value.trim();
        selectedObject.speechTimer = selectedObject.speechText ? 300 : 0;
      }
    }

    function bringToLife() {
      playSound('magic');

      if (activeCategory === 'backgrounds') {
        if (currentWorldBackground === -1) {
          customBackgroundDataUrl = studioCanvas.toDataURL();
        }
        triggerScreenSparkles();
        switchMode('world');
        updateQuestProgress('backgrounds');
        return;
      }

      const drawnDataUrl = studioCanvas.toDataURL();

      const spawnX = worldCanvas.width / 2 + (Math.random() - 0.5) * 120;
      const spawnY = worldCanvas.height / 2 + (Math.random() - 0.5) * 100;

      const list = DEFAULT_SPEECH[activeCategory] || DEFAULT_SPEECH.people;
      const speech = list[Math.floor(Math.random() * list.length)];

      const newActor = new KingdomActor(drawnDataUrl, activeCategory, spawnX, spawnY, speech);
      worldObjects.push(newActor);
      selectedObject = newActor;

      updateQuestProgress(activeCategory);
      triggerScreenSparkles();
      switchMode('world');
      updateControlPanel();
    }

    function triggerScreenSparkles() {
      const container = document.getElementById('fx-container');
      container.innerHTML = '';
      for (let i = 0; i < 20; i++) {
        const star = document.createElement('div');
        star.className = 'absolute text-2xl animate-ping';
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.innerText = ['✨', '⭐', '🎉', '💖'][Math.floor(Math.random() * 4)];
        container.appendChild(star);
      }
      setTimeout(() => { container.innerHTML = ''; }, 1200);
    }

    function worldLoop() {
      worldCtx.clearRect(0, 0, worldCanvas.width, worldCanvas.height);

      drawKingdomEnvironment(worldCtx, worldCanvas.width, worldCanvas.height);

      worldObjects.sort((a, b) => a.y - b.y);

      worldObjects.forEach(obj => {
        obj.update(worldCanvas.width, worldCanvas.height);
        obj.draw(worldCtx);
      });

      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw(worldCtx);
      });

      requestAnimationFrame(worldLoop);
    }

    function drawKingdomEnvironment(ctx, w, h) {
      if (currentWorldBackground === -1 && customBackgroundDataUrl) {
        if (!window._customBgImg || window._customBgSrc !== customBackgroundDataUrl) {
          window._customBgImg = new Image();
          window._customBgImg.src = customBackgroundDataUrl;
          window._customBgSrc = customBackgroundDataUrl;
        }
        if (window._customBgImg.complete) {
          ctx.drawImage(window._customBgImg, 0, 0, w, h);
          return;
        }
      }

      if (currentWorldBackground > 0) {
        const bgSvgUrl = generateSkinSVG('backgrounds', currentWorldBackground);
        if (!window._bgImg || window._bgIndex !== currentWorldBackground) {
          window._bgImg = new Image();
          window._bgImg.src = bgSvgUrl;
          window._bgIndex = currentWorldBackground;
        }
        if (window._bgImg.complete) {
          ctx.drawImage(window._bgImg, 0, 0, w, h);
          return;
        }
      }

      // Default vibrant sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, '#7BDFF2');
      skyGrad.addColorStop(0.5, '#B2F7EF');
      skyGrad.addColorStop(1, '#EFF7CF');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.beginPath();
      ctx.arc(w * 0.18, h * 0.15, 35, 0, Math.PI * 2);
      ctx.arc(w * 0.23, h * 0.12, 45, 0, Math.PI * 2);
      ctx.arc(w * 0.28, h * 0.15, 35, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#52B788';
      ctx.beginPath();
      ctx.ellipse(w * 0.25, h * 0.82, w * 0.45, h * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#74C69D';
      ctx.beginPath();
      ctx.ellipse(w * 0.8, h * 0.86, w * 0.5, h * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#95D5B2';
      ctx.beginPath();
      ctx.ellipse(w * 0.5, h * 0.92, w * 0.65, h * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function onWorldMouseDown(e) {
      initAudio();
      const rect = worldCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      let clickedObj = null;
      for (let i = worldObjects.length - 1; i >= 0; i--) {
        if (worldObjects[i].containsPoint(mx, my)) {
          clickedObj = worldObjects[i];
          break;
        }
      }

      if (clickedObj) {
        selectedObject = clickedObj;
        draggedObject = clickedObj;
        dragOffsetX = mx - clickedObj.x;
        dragOffsetY = my - clickedObj.y;
        clickedObj.clickSoftReaction();
        updateControlPanel();
      } else {
        selectedObject = null;
        updateControlPanel();
      }
    }

    function onWorldMouseMove(e) {
      if (!draggedObject) return;
      const rect = worldCanvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      draggedObject.x = mx - dragOffsetX;
      draggedObject.y = my - dragOffsetY;
    }

    function onWorldMouseUp() {
      draggedObject = null;
    }

    function updateControlPanel() {
      const panel = document.getElementById('item-control-panel');
      const label = document.getElementById('selected-item-label');
      const speechInput = document.getElementById('speech-input');

      if (selectedObject) {
        panel.classList.remove('hidden');
        label.innerText = `${selectedObject.category}`;
        if (speechInput) speechInput.value = selectedObject.speechText || '';
        updateAnimationChips();
      } else {
        panel.classList.add('hidden');
      }
    }

    function scaleSelectedItem(factor) {
      if (selectedObject) {
        playSound('tap');
        selectedObject.scale = Math.max(0.4, Math.min(2.5, selectedObject.scale * factor));
      }
    }

    function deleteSelectedItem() {
      if (selectedObject) {
        playSound('pop');
        worldObjects = worldObjects.filter(o => o !== selectedObject);
        selectedObject = null;
        updateControlPanel();
      }
    }

    function deselectItem() {
      selectedObject = null;
      updateControlPanel();
    }

    /* --------------------------------------------------
     * 5. LOCAL STORAGE SAVE & LOAD KINGDOM
     * -------------------------------------------------- */
    const STORAGE_KEY = 'doodle_kingdom_save_data';

    function saveKingdom() {
      try {
        playSound('save');
        const kingdomData = {
          currentWorldBackground,
          customBackgroundDataUrl,
          quests: quests.map(q => ({ id: q.id, current: q.current, done: q.done })),
          objects: worldObjects.map(obj => ({
            category: obj.category,
            x: obj.x,
            y: obj.y,
            scale: obj.scale,
            animation: obj.animation,
            speechText: obj.speechText,
            imgData: obj.imgData
          }))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(kingdomData));
        triggerScreenSparkles();
        alert('✨ Kingdom Saved Successfully!');
      } catch (err) {
        console.error('Failed to save kingdom:', err);
        alert('Unable to save kingdom. Storage may be full.');
      }
    }

    function loadKingdom() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          alert('No saved kingdom found!');
          return;
        }
        playSound('load');
        const data = JSON.parse(raw);

        currentWorldBackground = data.currentWorldBackground || 0;
        customBackgroundDataUrl = data.customBackgroundDataUrl || null;

        if (data.quests) {
          data.quests.forEach(sq => {
            const q = quests.find(q => q.id === sq.id);
            if (q) {
              q.current = sq.current;
              q.done = sq.done;
            }
          });
          renderQuests();
        }

        if (data.objects) {
          worldObjects = data.objects.map(o => {
            const actor = new KingdomActor(o.imgData, o.category, o.x, o.y, o.speechText || '');
            actor.scale = o.scale || 1.0;
            actor.animation = o.animation || 'idle';
            return actor;
          });
        }

        selectedObject = null;
        updateControlPanel();
        triggerScreenSparkles();
        alert('🏰 Kingdom Loaded Successfully!');
      } catch (err) {
        console.error('Failed to load kingdom:', err);
        alert('Error loading saved kingdom data.');
      }
    }

    /* --------------------------------------------------
     * 6. MODE SWITCHING & QUEST LOGIC
     * -------------------------------------------------- */
    function switchMode(mode) {
      playSound('tap');
      const worldSec = document.getElementById('mode-world');
      const studioSec = document.getElementById('mode-studio');
      const worldBtn = document.getElementById('nav-world-btn');
      const studioBtn = document.getElementById('nav-studio-btn');

      if (mode === 'world') {
        worldSec.classList.remove('hidden');
        studioSec.classList.add('hidden');
        worldBtn.className = 'px-3 md:px-5 py-1 md:py-1.5 rounded-full font-bold text-xs md:text-base transition-all flex items-center gap-1.5 bg-white text-purple-700 shadow-md';
        studioBtn.className = 'px-3 md:px-5 py-1 md:py-1.5 rounded-full font-bold text-xs md:text-base transition-all flex items-center gap-1.5 text-white hover:text-yellow-200';
      } else {
        worldSec.classList.add('hidden');
        studioSec.classList.remove('hidden');
        studioBtn.className = 'px-3 md:px-5 py-1 md:py-1.5 rounded-full font-bold text-xs md:text-base transition-all flex items-center gap-1.5 bg-white text-purple-700 shadow-md';
        worldBtn.className = 'px-3 md:px-5 py-1 md:py-1.5 rounded-full font-bold text-xs md:text-base transition-all flex items-center gap-1.5 text-white hover:text-yellow-200';
        setTimeout(resizeStudioCanvas, 50);
      }
    }

    const quests = [
      { id: 'people', title: 'Add 1 Hero Character', target: 1, current: 0, done: false, icon: '👥' },
      { id: 'animal', title: 'Add 1 Animal Companion', target: 1, current: 0, done: false, icon: '🐾' },
      { id: 'tool', title: 'Add 1 Crafting Tool', target: 1, current: 0, done: false, icon: '🛠️' },
      { id: 'monster', title: 'Add 1 Monster Creature', target: 1, current: 0, done: false, icon: '👾' },
      { id: 'vehicle', title: 'Add 1 Vehicle', target: 1, current: 0, done: false, icon: '🚒' },
      { id: 'castle', title: 'Build 1 Castle Fortress', target: 1, current: 0, done: false, icon: '🏰' },
      { id: 'tree', title: 'Plant 1 Tree', target: 1, current: 0, done: false, icon: '🌳' },
      { id: 'backgrounds', title: 'Pick a Custom Background Theme', target: 1, current: 0, done: false, icon: '🏞️' }
    ];

    function renderQuests() {
      const list = document.getElementById('quest-list');
      list.innerHTML = '';
      let completed = 0;

      quests.forEach(q => {
        if (q.current >= q.target) q.done = true;
        if (q.done) completed++;

        const div = document.createElement('div');
        div.className = `p-2 rounded-2xl flex items-center justify-between border-2 ${q.done ? 'bg-green-50 border-green-400' : 'bg-slate-50 border-slate-200'}`;
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-lg">${q.icon}</span>
            <div>
              <p class="font-bold text-xs text-slate-800 ${q.done ? 'line-through text-slate-400' : ''}">${q.title}</p>
              <p class="text-[10px] font-bold text-slate-400">${q.current}/${q.target} Done</p>
            </div>
          </div>
          <div>
            ${q.done ? '<i class="fa-solid fa-circle-check text-green-500 text-base"></i>' : '<i class="fa-regular fa-circle text-slate-300 text-base"></i>'}
          </div>
        `;
        list.appendChild(div);
      });

      document.getElementById('quest-count-badge').innerText = `${completed}/${quests.length}`;
    }

    function updateQuestProgress(category) {
      const q = quests.find(q => q.id === category);
      if (q && !q.done) {
        q.current += 1;
        renderQuests();
      }
    }

    function toggleQuestPanel() {
      playSound('tap');
      document.getElementById('quest-panel').classList.toggle('hidden');
    }

    /* --------------------------------------------------
     * 7. INITIALIZATION & AUTO LOAD
     * -------------------------------------------------- */
    window.onload = () => {
      initStudio();
      initWorld();
      renderQuests();
    };
  </script>
</body>
</html>
